name: Build and publish container image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/build-container.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare image metadata
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.vars.outputs.image }}
      container_base_tag: ${{ steps.vars.outputs.container_base_tag }}
      db_backup_tag: ${{ steps.vars.outputs.db_backup_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned upstream tags
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          container_base_tag="$(grep -m1 '^ARG CONTAINER_BASE_TAG=' Dockerfile | cut -d= -f2- | tr -d '"')"
          db_backup_tag="$(grep -m1 '^ARG DB_BACKUP_TAG=' Dockerfile | cut -d= -f2- | tr -d '"')"

          test -n "${container_base_tag}"
          test -n "${db_backup_tag}"

          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
          echo "container_base_tag=${container_base_tag}" >> "${GITHUB_OUTPUT}"
          echo "db_backup_tag=${db_backup_tag}" >> "${GITHUB_OUTPUT}"

  build-amd64:
    name: Build AMD64
    needs: prepare
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL || true
          docker system prune --all --force || true
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push AMD64 image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            CONTAINER_BASE_TAG=${{ needs.prepare.outputs.container_base_tag }}
            DB_BACKUP_TAG=${{ needs.prepare.outputs.db_backup_tag }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=nfrastack-db-backup-amd64
          cache-to: type=gha,mode=min,scope=nfrastack-db-backup-amd64
          provenance: false
          sbom: false

  build-arm64:
    name: Build ARM64
    needs: prepare
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL || true
          docker system prune --all --force || true
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ARM64 image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          pull: true
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            CONTAINER_BASE_TAG=${{ needs.prepare.outputs.container_base_tag }}
            DB_BACKUP_TAG=${{ needs.prepare.outputs.db_backup_tag }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=nfrastack-db-backup-arm64
          cache-to: type=gha,mode=min,scope=nfrastack-db-backup-arm64
          provenance: false
          sbom: false

  publish-manifest:
    name: Publish multi-architecture manifest
    needs:
      - prepare
      - build-amd64
      - build-arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push manifest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          CONTAINER_BASE_TAG: ${{ needs.prepare.outputs.container_base_tag }}
          DB_BACKUP_TAG: ${{ needs.prepare.outputs.db_backup_tag }}
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${DB_BACKUP_TAG}" \
            --tag "${IMAGE}:${DB_BACKUP_TAG}-base-${CONTAINER_BASE_TAG}" \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"

      - name: Inspect published image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DB_BACKUP_TAG: ${{ needs.prepare.outputs.db_backup_tag }}
        shell: bash
        run: docker buildx imagetools inspect "${IMAGE}:${DB_BACKUP_TAG}"
